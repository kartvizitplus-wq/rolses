name: Android uygulaması (APK)

# main dalına her yüklemede telefona kurulabilir bir APK üretir ve
# GitHub'da "Releases > son-surum" altına koyar.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'supabase/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Paketleri kur
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix
      - name: Android projesini oluştur
        run: npx expo prebuild --platform android --no-install
      - name: APK derle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk RolSes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RolSes-apk
          path: RolSes.apk
      - name: Son sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: RolSes — son sürüm (test)
          prerelease: true
          body: |
            Telefona kurmak için RolSes.apk dosyasını indirin.
            Bu bir test sürümüdür; Google Play sürümü EAS ile ayrıca imzalanır.
          files: RolSes.apk
